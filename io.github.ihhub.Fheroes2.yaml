app-id: io.github.ihhub.Fheroes2
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: fheroes2.sh
rename-appdata-file: fheroes2.metainfo.xml
rename-desktop-file: fheroes2.desktop
rename-icon: fheroes2
copy-icon: true
finish-args:
  # Input devices such as controllers
  - --device=input
  # Direct Rendering Interface. Necessary for GL.
  - --device=dri
  # Fallback to all devices on Flatpak versions without input device support
  - --device-if=all:!has-input-device
  # Wayland access with X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  # X11 + XShm access
  - --share=ipc
  # Pulseaudio access
  - --socket=pulseaudio
  # File Manager
  - --talk-name=org.freedesktop.FileManager1.*
  # Network for demo download
  - --share=network
cleanup:
  - /share/doc
  - /share/man

modules:
  # Source: https://github.com/flathub/com.valvesoftware.Steam.Utility.steamtinkerlaunch/blob/e73c48175dbe71a4862eb20fd67466c2314e2492/modules/innoextract.yml#L2
  - name: innoextract
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: 3.5
    config-opts:
      - -DBoost_USE_STATIC_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9.tar.gz
        sha256: 6344a69fc1ed847d4ed3e272e0da5998948c6b828cb7af39c6321aba6cf88126
        x-checker-data:
          type: anitya
          project-id: 8646
          stable-only: true
          url-template: https://github.com/dscharrer/innoextract/releases/download/$version/innoextract-$version.tar.gz
      # Patch innoextract failing to build with boost 1.85+: https://github.com/dscharrer/innoextract/pull/169
      - type: patch
        path: patches/innoextract-169.patch
      # Patch innoextract failing to build with boost 1.89+: https://github.com/dscharrer/innoextract/pull/199
      - type: patch
        path: patches/innoextract-199.patch
    modules:
      - name: boost
        buildsystem: simple
        build-commands:
          - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=date_time,filesystem,iostreams,program_options
          - ./b2 -j$FLATPAK_BUILDER_N_JOBS link=static install
        cleanup:
          - "*"
        sources:
          - type: archive
            url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
            sha256: 5734305f40a76c30f951c9abd409a45a2a19fb546efe4162119250bbe4d3a463
            x-checker-data:
              type: anitya
              project-id: 6845
              stable-only: true
              url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_${patch}.tar.gz

  - name: bchunk
    buildsystem: simple
    build-commands:
      - make
      - install -Dm 744 bchunk -t /app/bin
    sources:
      - type: git
        url: https://github.com/hessu/bchunk
        tag: release/1.2.2
        commit: 0c7009d1d2be1cc12edebf926010f417069b6211
        x-checker-data:
          type: git
          tag-pattern: ^.*?([\d.]+)$

  - name: fheroes2
    buildsystem: cmake-ninja
    config-opts:
      - -DSDL2MAIN_LIBRARY=
    post-install:
      - desktop-file-edit --set-key=Exec --set-value=fheroes2.sh ${FLATPAK_DEST}/share/applications/fheroes2.desktop
      - install -Dm 744 fheroes2.sh -t /app/bin
      - install -Dm 644 files/timidity/timidity.cfg -t ${FLATPAK_DEST}/etc
      - install -Dm 644 files/timidity/instruments/* -t ${FLATPAK_DEST}/etc/instruments
    sources:
      - type: git
        url: https://github.com/ihhub/fheroes2
        tag: 1.1.17
        commit: 2685c2188b541660f1ce261b554c3e92f79b1775
        x-checker-data:
          is-main-source: true
          type: git
      - type: file
        path: fheroes2.sh
        dest-filename: fheroes2.sh
